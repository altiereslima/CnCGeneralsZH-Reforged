; Zero Hour Reforged command bar schemes, loaded after ControlBarScheme.ini. A scheme EA defined is
; edited in place and a block holds only what changes.
;
; Not in the multiplayer INI checksum: a scheme only places the bar's windows.
;
; The Classic bar's four small buttons down the left of the middle plate (options, idle worker,
; beacon and chat) stay where EA put them on every side, x 184-220, the way 1.04 drew them.
;
; EA's Chinese beacon button at rest, SNBeacon, has no alpha, so it stood on a black card. The
; Chinese schemes wear ReforgedChinaBeacon, the same picture with its corners open
; (Tools/china_beacon.py).

ControlBarScheme China8x6
  BeaconButtonEnable ReforgedChinaBeacon
End

ControlBarScheme ChinaTankGeneral8x6
  BeaconButtonEnable ReforgedChinaBeacon
End

ControlBarScheme ChinaInfantryGeneral8x6
  BeaconButtonEnable ReforgedChinaBeacon
End

ControlBarScheme ChinaNukeGeneral8x6
  BeaconButtonEnable ReforgedChinaBeacon
End

ControlBarScheme ChinaBossGeneral8x6
  BeaconButtonEnable ReforgedChinaBeacon
End
