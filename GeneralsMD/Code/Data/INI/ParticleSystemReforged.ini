; The Paladin's and the Avenger's hard-kill charge bursting at a missile (FX_ActiveProtectionBlast in
; FXListReforged.ini). The Rocket Buggy's explosion it first borrowed lives 100 frames and grew into a
; cloud the size of the tank, stacking into a column under a run of intercepts. These three are over
; inside half a second and stay about a quarter of a tank across: a flash of 8 frames, a handful of
; fragments thrown about 20 out, and a grey puff that thins away in 15 frames. No name here holds
; "smoke", so -smoke leaves them alone.

