; The pale green haze an Alpha Aurora bomb left on the ground for the rest of the match. This system
; never ends by itself: every 30 frames it throws ten scorch flecks, and each fleck trails a puff of
; AirF_AuroraBombGas1 in R:213 G:236 B:159 that swells to a hundred units across. EA only ever
; played it through AirF_FX_AuroraBombExplode with AttachToObject on the bomb's own FXListDie, and the
; bomb is gone before the particles next update, so the system died without emitting once: the Air
; Force General's Aurora never shows it. FixesReforged.ini plays the same FXList as the Alpha Aurora
; weapon's ProjectileDetonationFX, at a position with nothing to attach to, and there it emitted
