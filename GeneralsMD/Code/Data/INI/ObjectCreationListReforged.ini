; ==== Particle Uplink death lasers ================================================================

; The Superweapon General's cannon fires a pink beam, and its dying uplink still threw the blue
; lasers of the plain one. SupW_SDILasers is the same model drawn with a pink texture.

ObjectCreationList SupW_OCL_SDILinkLasers
  CreateObject
    ObjectNames = SupW_SDILasers
    Disposition = LIKE_EXISTING
    Count       = 1
    MinLifetime   = 3000
    MaxLifetime   = 3000
    Offset = X:30 Y:0 Z:0
  End
End

