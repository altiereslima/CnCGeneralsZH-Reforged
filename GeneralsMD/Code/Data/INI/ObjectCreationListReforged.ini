; Object creation lists EA left out or got wrong. GameEngine::init loads this right after
; ObjectCreationList.ini with INI_LOAD_OVERWRITE, so a list named here is cleared and replaced
; whole and a new name is added. It lands in the multiplayer INI CRC.

; ==== Battlemaster Paradrop =======================================================================

; The Tank General's Battlemasters were dropped with the infantry paradrop's timing: the plane
; opened its doors 300 out from the 50-wide marker and the second tank followed 80 ms after the
; first, so a single tank landed well short and a pair landed on top of each other. The doors now
; open 120 out for one tank and 140 for two, 300 ms apart, as in the 1.04 community patch.

ObjectCreationList Tank_SUPERWEAPON_TankParadrop1
  DeliverPayload
    Transport = ChinaJetCargoPlane
    StartAtPreferredHeight = Yes
    StartAtMaxSpeed = Yes
    MaxAttempts = 4
    DropOffset = X:0 Y:0 Z:-10
    DropDelay = 300
    ParachuteDirectly = No
    PutInContainer = LargeParachute
    Payload = Tank_ChinaTankBattleMaster 1
    DeliveryDistance = 0
    PreOpenDistance = 120
    DeliveryDecalRadius = 50
    DeliveryDecal
      Texture           = SCCParadrop_USA
      Style             = SHADOW_ALPHA_DECAL
      OpacityMin        = 25%
      OpacityMax        = 50%
      OpacityThrobTime  = 500
      Color             = R:227 G:229 B:22 A:255
      OnlyVisibleToOwningPlayer = Yes
    End
  End
End

