; Modern water material rules. Classic water keeps the map's original settings.
; A rule matches ANY listed color AND ANY listed texture (case-insensitive basename).
; Add Color and Texture entries to extend the lists. First matching enabled rule wins.
; Keep separate rules when only specific color/texture pairs should match.
; ReplacementColor is display RGB, Brightness is 0.1..1, Pollution is 0..1.
; Optional fields default to Brightness=1, Pollution=0, Bubbles=No, Enabled=Yes.
; Missing/invalid file uses this built-in default; invalid files log the error line.
; An empty/comment-only file disables every rule. Enabled=No disables one rule.
; This file is read only: the game never regenerates or overwrites custom edits.

ModernWaterRule PollutedWater
  MatchColors
    Color = R:50 G:75 B:50
  End

  MatchTextures
    Texture = TSWater03.tga
  End

  ReplacementColor = R:45 G:58 B:11
  Brightness = 0.67
  Pollution = 0.80
  Bubbles = Yes
End
