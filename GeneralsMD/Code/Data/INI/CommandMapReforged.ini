;-----------------------------------------------------------------------------
; Single-player test hook: take over the next player - its AI is thrown away,
; so its base and units answer to you and nothing fights you for them.  Press
; again to walk on to the next one and eventually back to your own.  Does
; nothing in a network game or a replay.
CommandMap SWITCH_CONTROL
  Key = KEY_T
  Transition = DOWN
  Modifiers = SHIFT_CTRL
  UseableIn = GAME
  Category = DEBUG
End
