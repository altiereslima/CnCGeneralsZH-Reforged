  DisplayName = GUI:SelectNextIdleWorker
End

; Attack (A), stop (S), attack move (D), guard (X) and hold position (C) have no
; record of their own any more: they are the grid's places on those keys, and
; the grid posts the same message a record here used to (orderAtPlace in
; ControlBar.cpp).  A record of their own on the same letter would come before
; the grid's in the list and steal the key from a structure standing there.

; the order queue.  Retail put it on ALT; here it is SHIFT, the key every other RTS
; queues with, and the same key that adds to the selection - the two records both
; fire on the one modifier (MetaEvent.cpp), so a shift-click still adds a unit and
; a shift-right-click still queues an order.  Each queued point draws its own
; thread and marker, and they stay up after the key is let go.
CommandMap BEGIN_WAYPOINTS
  Key = KEY_NONE
  Transition = DOWN
  Modifiers = SHIFT
  UseableIn = GAME
End

CommandMap END_WAYPOINTS
  Key = KEY_NONE
  Transition = UP
  Modifiers = SHIFT
  UseableIn = GAME
End

; the general's promotion screen.  It used to sit on the key above tab; the console took that
; key, and takes it in the translator before the command map is consulted, so a binding there
; would never fire again.
CommandMap TOGGLE_PURCHASE_SCIENCE
  Key = KEY_BACKSLASH
  Transition = DOWN
  Modifiers = NONE
  UseableIn = GAME
  Category = INTERFACE
  Description = GUI:TogglePurchaseScienceDescription
  DisplayName = GUI:TogglePurchaseScience
End

; smoke signals for your allies, where the cursor is or on the radar spot under it,
; gone after three seconds.  The grid's bottom row again, on the one modifier the
; grid leaves alone: Z attack here, X defend here, C look here.  Network games only.
CommandMap SIGNAL_ATTACK
  Key = KEY_Z
  Transition = DOWN
  Modifiers = ALT
  UseableIn = GAME
  Category = INFORMATION
  Description = GUI:SignalAttackDescription
  DisplayName = GUI:SignalAttack
End

CommandMap SIGNAL_DEFEND
