;
; MASTER COPY - this is the tracked one.  The build copies it to
; Run/Data/INI/CommandMapReforged.ini, which is where the game reads it from and
; which is gitignored, so edit THIS file and rebuild (or copy it across by hand).
;
; It used to be Data\INI\CommandMap.ini, a name EA's own exe reads too.  When
; Steam put the retail generals.exe back over this build, that exe met the
; commands below it has never heard of and died at start with "Error parsing
; INI file 'Data\INI\CommandMap.ini'" - three crash reports on 2026-09-23 alone.
; Under a name only this exe asks for, a retail exe starts as plain Zero Hour.
;
; Loose overlay, loaded after Data\<Language>\CommandMap.ini, so a block here
; overrides that file entry-for-entry and new commands can be added.  Every
; binding this fork adds or moves lives here.
;
; Grid command bar, which is how the bar is driven - there is no other scheme and
; no switch: the command grid is 6 columns x 3 rows and the keys sit under the
; left hand in the same shape, one key per place.
;
;   slot 01 02 03 04 05 06   (top row)      Q  W  E  R  T  Y
;   slot 07 08 09 10 11 12   (middle row)   A  S  D  F  G  H
;   slot 13 14 15 16 17 18   (bottom row)   Z  X  C  V  B  N
;
; The owner's fixed places: a unit's A attack, S stop, D attack move, Z eject,
; X guard, C hold position; a building's N sell, B rally point, Z evacuate.  The
; rest of a command set fills the free places in reading order, what it builds
; first and its abilities and upgrades after (ControlBar_commandPlaces).  A key
; whose place holds its own order, or nothing, still does that order.

CommandMap COMMAND_SLOT01
  Key = KEY_Q
  Transition = DOWN
  Modifiers = NONE
  UseableIn = GAME
  Category = CONTROL
  Description = GUI:CommandSlot01Description
  DisplayName = GUI:CommandSlot01
End

