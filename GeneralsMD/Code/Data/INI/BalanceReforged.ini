; ---- tanks and cars build up speed and brake for it ----------------------------------------------
;
; EA gave these Acceleration and Braking of 1000 (their own first numbers are still in the comments
; of Locomotor.ini: 240 and 50), which takes a 30-speed tank from rest to top speed in one frame and
; back in another. They now take about 1.2 seconds to get up to speed, a light vehicle about one, and
; three quarters of a second to stop. The drive that uses them is Locomotor::moveTowardsPositionVehicle.
; A Locomotor block here edits EA's template in place, like an Object block; AccelerationDamaged is
; named because EA's file set it to 1000 too.
;
; Players found that 1.2 seconds sluggish, so every ground vehicle a player can build, on all three
; sides and in every general's army, now has a quarter more Acceleration, AccelerationDamaged and
; Braking than it had: a Crusader is at 99% of top speed 35 frames after the order where it took 41
; (Scenarios/vehicleaccel.txt, -tracemove 57). The "was" comments
; give the number before that. The Listening Outpost's Acceleration and every vehicle after it kept
; EA's numbers until then and get the same quarter on top of them ("EA" comments). Speed is
; untouched. Aircraft taxiing, infantry, boats and the campaign's civilian cars are left alone.
;
; The same vehicles turn faster too: TurnRate and TurnRateDamaged are a quarter above EA's, and never
; below 120 degrees a second. The quarter alone left the Overlord at 75, and its sluggishness was the
; turn, not the start: a tank pivots on the spot at half its TurnRate (TREAD_PIVOT_SHARE in
; Locomotor.cpp), so EA's 60 swung it round at 30 degrees a second. The floor reaches the Overlord
; family, the SCUD Launcher (EA: 50) and the 90-degree trucks, dozers and Nuke Cannon, and it also
; lifts their TurnRateDamaged, which EA had set below TurnRate. Sent to a point straight behind it
; (Scenarios/vehicleturn.txt), an Overlord reaches 90% of top speed on the new heading 74 frames after
; the order where it took 131; a Crusader 53 where it took 58. Turret turn rates are separate and
; untouched.

Locomotor TomahawkLocomotor
  Acceleration        = 31.25   ; was 25
  AccelerationDamaged = 31.25   ; was 25
  Braking             = 50      ; was 40
  TurnRate            = 225     ; EA: 180
  TurnRateDamaged     = 225     ; EA: 180
End

