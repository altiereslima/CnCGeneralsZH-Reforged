  Armor = INFANTRY_MISSILE    25%
  Armor = PARTICLE_BEAM       200%
  Armor = KILL_PILOT          0%
  Armor = SURRENDER           0%
  Armor = AURORA_BOMB         200%
  Armor = STEALTHJET_MISSILES 250%
  Armor = JET_MISSILES        25%
  Armor = LAND_MINE           0%
  Armor = FLAME               50%
  Armor = SUBDUAL_MISSILE     0%
  Armor = SUBDUAL_VEHICLE     0%
  Armor = SUBDUAL_BUILDING    100%
  Armor = ARMOR_PIERCING      50%   ; EA: 100%
End

