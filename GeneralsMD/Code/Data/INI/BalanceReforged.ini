; The rocket pods sit fixed under the nose too, and EA gave them no aim tolerance, so a Comanche
; turned until its nose was within 2 degrees of the point before the first rocket left. The rocket
; steers for its own spot in the spread 10 units out of the pod at 180 degrees a second, so 20
; degrees off the nose costs it a ninth of a second of turning. A side shot fires 3 frames sooner.

Weapon ComancheRocketPodWeapon
  AcceptableAimDelta = 20   ; EA: none, the 2 degrees every weapon gets
End

; ---- the Marauder's turret turns ---------------------------------------------------------------
;
; The model has a turret for each of its three gun levels and the draw module names all three, but
; EA never gave the logic a Turret block, so the whole tank swung round to aim and could not shoot
; on the move. The gun now sits on a turret that slews 100 degrees a second, as the Scorpion's does.
; That is slower than the hull turned: a target appearing straight behind a parked Marauder takes its
; first shell 24 frames later than it did, and 120 a second would still be 15 late. The new AI module
; keeps EA's only line, AutoAcquireEnemiesWhenIdle.

Object GLATankMarauder
  ReplaceModule ModuleTag_03
    Behavior = AIUpdateInterface ModuleTag_03_Reforged
      Turret
        TurretTurnRate        = 100
        RecenterTime          = 5000
        ControlledWeaponSlots = PRIMARY
      End
      AutoAcquireEnemiesWhenIdle = Yes
    End
  End
End

