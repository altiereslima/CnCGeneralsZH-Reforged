; The Paladin and the Avenger fire a small charge from the hull instead, which bursts the missile
; short of the tank: a puff and a bang at the hull, a blast at the missile. The weapons keep their
; reach and the laser's damage, which a missile cannot survive, but they come in clips now. The
; point defense module counts the clip itself (PointDefenseLaserUpdate), since it fires a fresh
; copy of its weapon every shot.
;
; A missile picks its death by DeathType, the same three ways in every missile EA made: LASERED
; plays a laser disintegration, DETONATED plays nothing (it is how a missile that reached its target
; leaves the world), and anything else plays a full Explosion with ExplosionSmoke, a grey cloud the
; size of a tank that stacked into a column under repeated intercepts. The charge kills with
; DETONATED, so the burst it plays itself is all there is to see.
;
; The Paladin's laser also burned down infantry that came within 65. A second launcher with its own
; clip does that, so a Tank Hunter's missile and the Tank Hunter himself no longer share one gun, and
; it kills with EXPLODED, which throws a soldier where the laser burned him. That needs a second
; weapon and a MULTIFILE file cannot add one, so it is AirF_RaptorPointDefenseLaser, which nothing
; fires any more since the King Raptor and the Boss Raptor took flares: every field that matters is
; set here, to the Paladin charge's numbers.
;
; The Paladin's laser had already been slowed to one shot in two seconds, because at EA's one a
; second it shot down every Patriot missile: Paladins killed a Patriot four times of four for 0.28
; of its price. Two charges a quarter second apart and a four second reload is 0.47 shots a second
; against the laser's 0.5, spent in a pair; the Patriot duel was not run again. The numbers after the
; change are in Scenarios/missiledefence.txt: the flares let through about what the lasers did, the
; Avenger bursts fewer missiles and dies on the same frame, the Paladin's two fights did not move.

Weapon PaladinPointDefenseLaser
  DelayBetweenShots      = 250    ; EA: 1000
  ClipSize               = 2      ; EA: 0
  ClipReloadTime         = 4000
  DeathType              = DETONATED
  LaserName              =
  FireFX                 = FX_ActiveProtectionLaunch
  ProjectileDetonationFX = FX_ActiveProtectionBlast
End

Weapon AirF_RaptorPointDefenseLaser    ; the Paladin's anti-personnel charge, see above
  PrimaryDamage          = 100.0
  PrimaryDamageRadius    = 0.0
  AttackRange            = 65.0
  DamageType             = LASER
  DelayBetweenShots      = 250
  ClipSize               = 2
  ClipReloadTime         = 4000
  DeathType              = EXPLODED
  LaserName              =
  FireFX                 = FX_ActiveProtectionLaunch
  ProjectileDetonationFX = FX_ActiveProtectionBlast
End

Weapon AvengerPointDefenseLaserOne
  DelayBetweenShots      = 250    ; EA: 500
  ClipSize               = 4      ; EA: 0
  ClipReloadTime         = 3000
  DeathType              = DETONATED
  LaserName              =
  FireFX                 = FX_ActiveProtectionLaunch
  ProjectileDetonationFX = FX_ActiveProtectionBlast
End

Weapon AvengerPointDefenseLaserTwo
  DelayBetweenShots      = 250    ; EA: 500
  ClipSize               = 4      ; EA: 0
  ClipReloadTime         = 3000
  DeathType              = DETONATED
  LaserName              =
  FireFX                 = FX_ActiveProtectionLaunch
  ProjectileDetonationFX = FX_ActiveProtectionBlast
End

Object AmericaTankPaladin
  ReplaceModule ModuleTag_07
    Behavior = PointDefenseLaserUpdate ModuleTag_07_Missiles
      WeaponTemplate              = PaladinPointDefenseLaser
      PrimaryTargetTypes          = BALLISTIC_MISSILE SMALL_MISSILE
      ScanRate                    = 500
      ScanRange                   = 120.0
      PredictTargetVelocityFactor = 3.0
    End
  End
  AddModule
    Behavior = PointDefenseLaserUpdate ModuleTag_07_Infantry
      WeaponTemplate              = AirF_RaptorPointDefenseLaser
      PrimaryTargetTypes          = INFANTRY
      ScanRate                    = 500
      ScanRange                   = 120.0
      PredictTargetVelocityFactor = 3.0
    End
  End
End

