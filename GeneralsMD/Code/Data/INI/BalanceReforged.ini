; ---- units, measured with equal-money duels (Tools/Balance/duel.py) --------------------------------
; A unit's share is the money its side has left out of both sides' leftovers, averaged over every
; cross-faction opponent and both start points. 0.50 is even.

; The Quad Cannon had the best share in the game at 0.68: seven of them for five Crusaders was a
; coin flip. At 800 it is 0.50, still wins against every infantry type and now loses to Paladins
; and Battlemasters. A missile armor change was tried first and moved nothing.

Object GLAVehicleQuadCannon
  BuildCost = 800   ; EA: 700
End

Object Chem_GLAVehicleQuadCannon
  BuildCost = 850   ; EA: 750
End

Object Demo_GLAVehicleQuadCannon
  BuildCost = 850   ; EA: 750
End

; The Dragon had the worst share at 0.26 to 0.32 and lost to every armored unit. At 400 health it
; is 0.51: it now trades evenly with Paladins and Quad Cannons and still loses to main battle tanks.
; A longer flame (100 against 75) put it at 0.58 and beating Tunnel Defenders, which is too far.

Object ChinaTankDragon
  ReplaceModule ModuleTag_02
    Body = ActiveBody ModuleTag_02_Reforged
      MaxHealth = 400.0   ; EA: 280
      InitialHealth = 400.0
      SubdualDamageCap = 800
      SubdualDamageHealRate = 500
      SubdualDamageHealAmount = 50
    End
  End
End

