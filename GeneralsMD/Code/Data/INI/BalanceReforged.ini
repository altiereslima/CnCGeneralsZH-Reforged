; ---- the Gattling Cannon costs what a Patriot costs ------------------------------------------------
; It is China's anti-infantry and anti-air tower and stays that: at 1000 it still loses to tanks
; (0.61 of its price), and wins against infantry at 1.72.

Object ChinaGattlingCannon
  BuildCost = 1000   ; EA: 1200
End

Object Infa_ChinaGattlingCannon
  BuildCost = 1000
End

Object Nuke_ChinaGattlingCannon
  BuildCost = 1000
End

Object Tank_ChinaGattlingCannon
  BuildCost = 1000
End

; ---- the Bunker and the Tunnel Network stand half as long again ------------------------------------
; Both wear StructureArmor, which every building shares, so they get health rather than armor.
; Tunnel against tanks went from 1.09 to 1.27, the Bunker against light vehicles from 0.64 to 0.91.

Object ChinaBunker
  ReplaceModule ModuleTag_05
    Body = StructureBody ModuleTag_05_Reforged
      MaxHealth = 1500.0   ; EA: 1000
      InitialHealth = 1500.0
      SubdualDamageCap = 1800
      SubdualDamageHealRate = 500
      SubdualDamageHealAmount = 100
    End
  End
End

