; ---- missile defence: flares on the Air Force General's aircraft, a hard-kill charge on the tanks ---
;
; EA gave these units a point defense laser that ran all the time and burned down every missile it
; reached. Measured with Scenarios/missiledefence.txt, seeds 7 and 8, before this change: two King
; Raptors flying seven passes over a Stinger Site shot down 113 of 117 Stingers and took 150 and 270
; damage of 480; an Avenger under five Tank Hunters shot down 14 and 16 of 29 and 30 missiles and
; died on frame 261 and 265; a Paladin under four Rocket Buggies shot down 4 of 36 and died on frame
; 376 and 380.
;
; The aircraft now drop flares instead. They are fitted from birth (StartsActive, no Countermeasures
; upgrade needed), and a Stinger that rolls the evasion turns onto the newest flare and burns out
; harmlessly. EA's upgrade decoys 30%; at 90%, with three volleys of four and a six second reload,
; the King Raptors took 60 to 180 damage, about what the lasers let through. Flares only work in
; the air, so a Chinook sitting on its pad has no missile defence at all; an Aurora on its supersonic
; run gets none (Weapon.cpp skips a supersonic victim); and they do nothing against a SCUD or a
; Tomahawk, which the lasers used to shoot down near these aircraft. A Countermeasures upgrade bought
; by an Air Force General still brings its armor.

Object AirF_AmericaJetRaptor
  RemoveModule ModuleTag_22
  RemoveModule ModuleTag_Laser_One
  ReplaceModule ModuleTag_26
    Behavior = CountermeasuresBehavior ModuleTag_26_Flares
      StartsActive          = Yes
      FlareTemplateName     = CountermeasureFlare
      VolleySize            = 4
      VolleyArcAngle        = 90.0
      VolleyVelocityFactor  = 2.0
      DelayBetweenVolleys   = 1000
      NumberOfVolleys       = 3
      ReloadTime            = 6000
      EvasionRate           = 90%
      ReactionLaunchLatency = 100
      MissileDecoyDelay     = 200
    End
  End
End

