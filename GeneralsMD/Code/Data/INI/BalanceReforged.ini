; ---- the Overlord's Gattling Cannon turns like a Gattling Tank's ------------------------------
;
; EA's rider turret turned 60 degrees a second against the Gattling Tank's 180 and held fire until
; it was within 2 degrees, so a target crossing the Overlord's path was mostly watched. It now has
; the Gattling Tank's turret: 180 degrees a second in both axes, and FiresWhileTurning, which opens
; fire 15 degrees out.

Object ChinaTankOverlordGattlingCannon
  ReplaceModule ModuleTag_03
    Behavior = AIUpdateInterface ModuleTag_03_Reforged
      Turret
        ControlledWeaponSlots = PRIMARY SECONDARY
        TurretTurnRate        = 180
        TurretPitchRate       = 180
