; Zero Hour Reforged window transitions, loaded after WindowTransitions.ini. Whole groups only, each
; with a name EA's file does not use.
;
; Not in the multiplayer INI checksum: a transition only animates menu windows.
;
; The campaign mission panel (MapBorder5, Tools/mainmenu_layout.py). USA, GLA or China in the single
; player menu flashes it in where EA flashed in the difficulty panel; a mission button swaps it for
; the difficulty panel, whose Back swaps it back; its own Back returns to the single player menu the
; way EA's difficulty Back did. Each side's pair copies EA's MainMenuDifficultyMenu<side> and
; MainMenuDifficultyMenu<side>Back with the mission panel in the difficulty panel's place.

WindowTransition MainMenuMissionMenuUS
  FireOnce = YES
  Window
    WinName = MainMenu.wnd:MapBorder5
    Style   = FLASH
    FrameDelay = 0
  END
  Window
    WinName = MainMenu.wnd:WinFactionUSMedium
    Style   = MAINMENUSCALEUP
    FrameDelay = 0
  END
  Window
    WinName = MainMenu.wnd:ButtonMission1
    Style   = BUTTONFLASH
    FrameDelay = 10
  END
  Window
    WinName = MainMenu.wnd:ButtonMission2
    Style   = BUTTONFLASH
    FrameDelay = 11
  END
  Window
    WinName = MainMenu.wnd:ButtonMission3
    Style   = BUTTONFLASH
    FrameDelay = 12
  END
  Window
    WinName = MainMenu.wnd:ButtonMission4
    Style   = BUTTONFLASH
    FrameDelay = 13
  END
  Window
    WinName = MainMenu.wnd:ButtonMission5
    Style   = BUTTONFLASH
    FrameDelay = 14
  END
  Window
    WinName = MainMenu.wnd:ButtonMissionBack
    Style   = BUTTONFLASH
    FrameDelay = 15
  END
END

