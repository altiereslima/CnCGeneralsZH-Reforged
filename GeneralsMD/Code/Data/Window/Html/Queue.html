<!DOCTYPE html>
<!--
  Everything the player has coming, playing: one cameo for each item queued in any factory or going
  up on the ground, the soonest first, in a row of cells growing right from the screen's left edge
  over the radar's under-attack light.  The tray is the general's powers' tray on the other side of
  the bar, mirrored.  The cameos, their clocks, their countdowns and the "+N" are the game's own and
  draw between the page's two layers.  Same materials as Window/Html/ControlBar.html.

  The game fills in, twice every frame the row is up (InGameUI::drawQueueTray):
    {{layer}}              "back" under the cameos, "front" over them: the cells' frames again, so
                           the steel lies over each picture's edge
    {{side}}               "america", "china" or "gla"
    {{tray.x}} .y .w .h    the tray, a panel as ControlBar.html's {{right.x}} is: .x and .y the
                           border's outer corner, .w and .h the cells it holds, .bt .br .bb .bl its
                           border's four widths
    data-each="cells"      a cell behind each cameo and the "+N", each {{cell.x}} .y .w .h
  All in the page's pixels, a pixel of an 800x600 screen.  Without this page the strip draws its
  column of the power bar's trays.
-->
<html>
<head>
<meta charset="utf-8">
<title>Queue</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { background-color: #3b4a36; }
  .piece { position: absolute; }
  .front .under, .back .over { display: none; }

  /* the tray: a steel plate lit from above, a light line along its top, dark down its right, which
     faces the battlefield, and along its bottom, which stands over it; the cells in a two pixel
     well.  The border's widths are written into each piece, since the page cannot add a width to a
     width */
  .tray { border-style: solid; border-color: transparent; }
  .tray .steel { position: absolute; background: linear-gradient(to bottom, #9aa3ad, #5a626c 30%, #353c45); }
  .tray .shine { position: absolute; height: 1px; background-color: #dde4ea; }
  .tray .shade { position: absolute; width: 1px; background-color: #0c1114; }
  .tray .base { position: absolute; height: 1px; background-color: #0c1114; }
  .tray .sunk { position: absolute; left: -2px; top: -2px; border: 2px solid #06090b;
                border-bottom-color: #b4bec8; border-right-color: #b4bec8; background-color: #3a414a; }
  .china .tray .steel { background: linear-gradient(to bottom, #c06a52, #7a3120 30%, #3f160f); }
  .china .tray .shine { background-color: #f0b8a4; }
  .china .tray .sunk { border-bottom-color: #d98a72; border-right-color: #d98a72; background-color: #45190f; }
  .gla .tray .steel { background: linear-gradient(to bottom, #b8ab6e, #766a3a 30%, #3c3519); }
  .gla .tray .shine { background-color: #ebe2b4; }
  .gla .tray .sunk { border-bottom-color: #cbbf82; border-right-color: #cbbf82; background-color: #423a1c; }

  /* a cell as the command grid's: dark, the well's steel laid over its edge and a bevel inside */
  .cell { background-color: #020405; }
  .cell.over { background: none; }
  .cell .edge { position: absolute; left: -1px; top: -1px; right: -1px; bottom: -1px; border: 3px solid #3a414a; }
  .china .cell .edge { border-color: #45190f; }
  .gla .cell .edge { border-color: #423a1c; }
  .cell .bevel { position: absolute; left: 2px; top: 2px; right: 2px; bottom: 2px; border: 1px solid #06090b;
                 border-bottom-color: #9aa4ae; border-right-color: #9aa4ae; }
  .china .cell .bevel { border-bottom-color: #d98a72; border-right-color: #d98a72; }
  .gla .cell .bevel { border-bottom-color: #cbbf82; border-right-color: #cbbf82; }
</style>
</head>
<body>
<div class="{{layer}} {{side}}">
  <div class="piece tray under" style="left: {{tray.x}}px; top: {{tray.y}}px; width: {{tray.w}}px; height: {{tray.h}}px; border-width: {{tray.bt}}px {{tray.br}}px {{tray.bb}}px {{tray.bl}}px">
    <div class="steel" style="left: -{{tray.bl}}px; right: -{{tray.br}}px; top: -{{tray.bt}}px; bottom: -{{tray.bb}}px"></div>
    <div class="shine" style="left: -{{tray.bl}}px; right: -{{tray.br}}px; top: -{{tray.bt}}px"></div>
    <div class="shade" style="right: -{{tray.br}}px; top: -{{tray.bt}}px; bottom: -{{tray.bb}}px"></div>
    <div class="base" style="left: -{{tray.bl}}px; right: -{{tray.br}}px; bottom: -{{tray.bb}}px"></div>
    <div class="sunk" style="width: {{tray.w}}px; height: {{tray.h}}px"></div>
  </div>
  <div class="piece cell under" data-each="cells" style="left: {{cell.x}}px; top: {{cell.y}}px; width: {{cell.w}}px; height: {{cell.h}}px"><div class="edge"></div><div class="bevel"></div></div>
  <div class="piece cell over" data-each="cells" style="left: {{cell.x}}px; top: {{cell.y}}px; width: {{cell.w}}px; height: {{cell.h}}px"><div class="edge"></div><div class="bevel"></div></div>
</div>
</body>
</html>
