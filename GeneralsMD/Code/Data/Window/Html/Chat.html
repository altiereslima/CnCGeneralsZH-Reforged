<!DOCTYPE html>
<!--
  The chat, in the screen's bottom left corner over the event feed (Window/Html/Feed.html) and
  clear of it even with all six of its lines up, the way Dota writes it: each line opens on the
  speaker's general's flag and his name in his colour.  With the chat shut the talk round the
  newest line is up, every line that came in the ten seconds before it, for ten seconds after it,
  the whole of it fading out over the last second and a half; the game fades the page, since the
  renderer draws no opacity.  Enter opens the typing bar to the team, Shift+Enter to everybody, and
  every line held, eight at most, stays up until it shuts.  The chat's own windows sit under the bar
  and take the keys; this page draws everything.  Same materials as Window/Html/Spectator.html,
  whose header says what the renderer draws.

  The game fills in, every frame the chat is up (InGameUI::drawChat):
    {{bar}}               the typing bar's top edge; the lines stand on it
    {{open}}               "open" while the chat is open
    {{typed}}              what has been typed so far, {{caret}} "lit" for half of every second
    {{audience}}           whom it goes to: everyone, allies or observers, in the player's language
    data-each="chat"       one entry a line, the oldest first: {{image}} the speaker's general,
                           {{color}} {{name}} and {{text}} what he said
  All in the page's pixels, a pixel of an 800x600 screen.
-->
<html>
<head>
<meta charset="utf-8">
<title>Chat</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { background-color: #3b4a36; color: #eef2f5; font-size: 9px; }

  #chat { position: absolute; left: 0; top: 0; width: 360px; }
  #lines { position: absolute; left: 0; bottom: 2px; width: 360px; }
  .line { height: 15px; line-height: 15px; margin-top: 1px; padding-left: 2px; white-space: nowrap;
          background: linear-gradient(to right, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.3) 70%, rgba(0, 0, 0, 0)); }
  .flag { width: 20px; height: 12px; margin-right: 4px; vertical-align: middle; }
  .who { font-weight: bold; }

  #bar { display: none; position: absolute; left: 0; width: 342px; height: 14px; line-height: 14px; padding: 3px 8px;
         background-color: rgba(0, 0, 0, 0.88); border: 1px solid #3a414a; border-top-color: #000000; }
  .open #bar { display: block; }
  .audience { color: #8a949f; margin-right: 5px; }
  .caret { display: none; color: #f2cf4a; }
  .caret.lit { display: inline; }
</style>
</head>
<body>
<div class="{{open}}">
  <div id="chat" style="height: {{bar}}px">
    <div id="lines">
      <div class="line" data-each="chat"><img class="flag" src="{{image}}"><span class="who" style="color: {{color}}">{{name}}:</span> {{text}}</div>
    </div>
  </div>
  <div id="bar" style="top: {{bar}}px"><span class="audience">{{audience}}</span>{{typed}}<span class="caret {{caret}}">|</span></div>
</div>
</body>
</html>
