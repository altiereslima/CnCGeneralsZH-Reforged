<!DOCTYPE html>
<!--
  The network box in the screen's top right corner, drawn with Window/Html/ControlBar.html and only
  while that page is up.  It is a page of its own because its clock and rates change several times a
  second, and a page is laid out again from its text every time any value in it changes: inside the
  command bar's page each of those changes laid out the whole bar, fifteen milliseconds a time.

  The game fills in, every frame (GameClient/HtmlTemplate.h):
    {{side}}               "america", "china" or "gla": the side whose bar is on screen
    {{net.clock}} ...      net.clock, net.game, net.real, net.hz, net.fps, net.renderer and
                           net.frame always, net.frame as of the last rate reading; net.ready,
                           net.runahead, net.room, net.in and net.out with {{net.online}} "online"
                           in a network game; net.units and net.cap with {{net.capped}} "capped"
                           under a unit limit
  All in the page's pixels, a pixel of an 800x600 screen.

  Edit the copy under Run/Window/Html and the next match reads it.
-->
<html>
<head>
<meta charset="utf-8">
<title>Network box</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { background-color: #3b4a36; font-size: 8px; color: #dfe5ea; }

  /* ControlBar.html's panel: a dark body under a steel rail, lit along the top and left */
  .panel { background-color: rgba(10, 16, 20, 0.94); border-top: 1px solid #aab4bf; border-left: 1px solid #8a949f;
           border-right: 1px solid #1a2026; }
  .china .panel { background-color: rgba(24, 9, 7, 0.94); border-top-color: #d98a72; border-left-color: #b8604b; }
  .gla .panel { background-color: rgba(21, 18, 8, 0.94); border-top-color: #cbbf82; border-left-color: #a99d62; }

  #net { position: absolute; right: 0; top: 0; padding: 3px 6px 3px 8px; border-right: 0; font-size: 7px; color: #c9d2d9; text-align: right; }
  #net .line { line-height: 10px; white-space: nowrap; }
  #net .big { font-size: 9px; font-weight: bold; color: #e8d27a; }
  #net .dim { color: #7d8a93; }
  #net .onlineonly { display: none; }
  #net.online .onlineonly { display: block; }
  #net .cappedonly { display: none; }
  #net .cappedonly.capped { display: block; }
</style>
</head>
<body>
<div class="{{side}}">
  <div id="net" class="panel {{net.online}}">
    <div class="line"><span class="big">{{net.clock}}</span>  {{net.game}} <span class="dim">({{net.real}})</span></div>
    <div class="line">{{net.hz}}hz  {{net.fps}}fps  <span class="dim">{{net.renderer}}  frame {{net.frame}}</span></div>
    <div class="line onlineonly">{{text:GUI:BarNetReady}} {{net.ready}}/{{net.runahead}}  {{text:GUI:BarNetRoom}} {{net.room}}fps  <span class="dim">&#8595;{{net.in}} &#8593;{{net.out}} KB/s</span></div>
    <div class="line cappedonly {{net.capped}}">{{net.units}}/{{net.cap}} {{text:GUI:BarNetUnits}}</div>
  </div>
</div>
</body>
</html>
