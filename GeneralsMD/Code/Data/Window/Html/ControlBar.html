<!DOCTYPE html>
<!--
  The command bar's frame, drawn where its three plates used to be, and the bar's own buttons, laid
  out the way the owner drew them on 2026-10-01: the console standing on the middle of the screen's
  bottom edge, one plate of steel with a well for each section side by side - the radar with the
  experience bar beside it, as tall as the console; the selection with, in the header strip over
  it, the idle worker's key, the skills key and the smoke signals; the
  command grid with the power bar in its header - with the general's powers growing out of its right
  hand end, and the top page hanging from the middle of the top edge, the match clock's plate over
  the money's.  Laid out at
  ControlBarHudScale(), 70 percent of the uniform scale the
  tooltips and the boards use.  The command buttons, the radar, the money and the
  portrait are still the bar's windows and paint over this page.  The power bar and the experience
  bar are the page's to draw: their windows take the clicks and draw
  nothing.  The menu, idle worker and promotion buttons are the page's altogether, pressed through
  data-click="press:Name"; the chat button is gone and Enter still opens the chat.  Same materials
  as Window/Html/Spectator.html, whose header says what the renderer draws and what not.

  Everything with class "solid" catches clicks for the bar; the rest of the screen is battlefield,
  whatever the old plates covered.  A data-click="press:Name" button must not be solid: its click
  reaches the page as a click on the battlefield.

  The game fills in, every frame (GameClient/HtmlTemplate.h):
    {{layer}}              "back" under the bar's windows; "front" drawn again after one grid's
                           buttons with nothing but {{side}} and data-each="frontcells", that grid's
                           cells, each {{cell.x}} .y .w .h, whose frames then lie over the buttons.
                           Every cell of every grid is its picture's rectangle, with {{ring}} the
                           steel round it in page pixels
    {{side}}               "america", "china" or "gla": the side whose bar is on screen
    {{promotion}}          "ready" while the general has a promotion to spend
    {{watching}}           "watching" while the local player is an observer or out of the match
    {{power.fill}}         the power bar: production as a percent of the bar, on the bar's own
    {{power.needle}}       logarithmic scale, consumption as the same ({{power.consumes}} "hidden"
                           while it is nought), and {{power.state}} "green",
                           "yellow" or "red"; the watched player's while watching.  The bar lies
                           flat: {{power.needlex}} is the needle's place in pixels along the groove
    data-each="powercells" the same production as 20 cells from the left, each {{lit}} "lit" up to
                           it, standing at {{x}} pixels inside the frame's lip, {{w}} wide, {{segw}}
                           without its black line
    {{expframe.x}} ...     the experience bar's groove beside the radar, .w and .h its inside,
                           {{expframe.innerw}} the width inside its lip; data-each="expcells" its
                           ten rungs from the bottom up, each {{lit}} "lit" up to the way from this
                           rank to the next, at {{y}} inside the lip, {{h}} tall, {{segh}} without
                           its black line
    data-each="rankstars"  a star for every rank there is, {{lit}} "lit" up to the one reached, at
                           {{x}} inside the 56 wide key so the row is centred on it
    data-each="commandcells" each {{cell.x}} .y .w .h: the command grid's places that hold a command,
                           six by three, each its key (Q W E R T Y, A S D F G H, Z X C V B N), an
                           empty one left as steel; its cells are a fifth bigger than the others
    {{attackkey.x}} ...    the attack, hold position and move places, where the page's own keys
    {{holdkey.x}} ...      stand, data-click="order:attack", "order:hold" and "order:move", for a
    {{movekey.x}} ...      selection that attack moves; no command set has a button for any of
                           them.  The game letters each with the key bound to its place
    {{stancekey.x}} ...    the stance key, data-click="order:stance", wherever the grid has room for it; {{stance}} is "aggressive" or "defensive", the first selected unit's
    data-each="portraitcells" the selection's cells, the portrait's first and then only what it
                           holds, each {{cell.x}} .y .w .h
    {{selinfo.x}} ...      beside a lone unit's portrait: {{sel.name}}, data-each="selstars" a star
                           at {{x}} from the right for each veterancy level, the health bar's dark
                           groove, {{sel.healthshown}} "hidden" for an enemy in disguise, and
                           data-each="selweapon" the main weapon's damage, damage a second and
                           range and data-each="selarmor" the armour's change to three kinds of
                           damage, each at {{x}} with {{label}} over {{value}} and {{state}}
                           "strong", "weak" or nothing; both empty for a disguise, the weapon's
                           for an unarmed unit.  The health's figure and its lit length are
                           Window/Html/Readout.html's
    data-each="skillcells" a cell behind each of the general's powers, each {{cell.x}} .y .w .h
    data-each="powersteel" the powers' steel, a column of it under each column of their cells from
                           the left, {{plate.x}} .y .w .h, against the console's right hand end and
                           down to the screen's bottom edge, each as high as its own cells, and
                           {{shadeh}} how far down its right hand side no column beside it covers
    {{signals.x}} ...      the smoke signals, three slots after the light in the selection's header;
                           data-click="signal:attack", "signal:defend" or "signal:look" sends one
                           to the middle of the view; {{signals.shown}} is "hidden" where the keys
                           would do nothing either, a game with no allies to see the smoke, and
                           {{signal0.drop}} to {{signal2.drop}} how far below its place each button
                           still is while they rise into the header
    url(Name.svg)          an SVG file under Window/Html, fitted whole into the box and centred
    {{blink}}              "lit" for half of every second while the general has a promotion to
                           spend, the one thing that blinks: a value that changes lays the whole
                           page out again.  The network box in the top right corner is
                           Window/Html/Net.html for the same reason, and the match clock and a
                           unit's health Window/Html/Readout.html
    {{panelN.x}} .y .w .h  N 0 to 2, left, centre and right: where the plates would have gone,
                           moving with the bar when it slides or minimises; .w and .h are 0 and
                           {{panelN.shown}} is "hidden" when a minimised bar has stood it down
    {{console.x}} .y .w .h the console's plate, {{clockbar.x}} ... the clock's on the top page and
    {{clockbar.x}} ...     {{moneybar.x}} ... the money's under it, each a container and a border
    {{moneybar.x}} ...     outside it: .x and .y the border's outer corner, .w and .h the
                           container, and .bt .br .bb .bl the border's four widths
    data-each="wells"      each of the console's wells, {{well.x}} .y .w .h, and the header strip
                           over it, {{header.x}} .y .w .h, {{header.shown}} "hidden" over the
                           radar's, which reaches up to the console's top line
    {{idletab.x}} ...      in the selection's header from its left, on a grid of seven 30 pixel
    {{skillstab.x}} ...    slots: the idle worker's key, {{idleflash}} "flash" for half of every
                           0.7 seconds of the client's clock while one is idle; and the skills key,
                           two slots, the rank's stars, pressed through
                           data-click="press:ButtonGeneral" for the promotion screen
    {{powerframe.x}} ...   the power bar's groove in the command grid's header strip;
                           {{powerframe.inner}} the height inside the frame and its lip
    {{clock.x}} ...        the match clock's well at the top of the top page, its figure
                           Readout.html's
    {{moneyblock.x}} ...   the money's well under it, the money's window moved into it
    {{peacebar.x}} ...     while the lobby's peace time runs, a third plate under the money's,
    {{peace.x}} ...        framed as the other two, and its well; the figure is Readout.html's
    {{Name.x}} .y .w .h    the rectangle of the bar's window Name, {{Name.shown}} "shown" or "hidden"
                           and {{Name.state}} any of "disabled", "hilite", "pushed", for LeftHUD (the
                           radar), RightHUD (the portrait's box), CameoWindow (the portrait),
                           CommandWindow, MoneyDisplay, PowerWindow, GeneralsExp, ButtonGeneral,
                           ButtonLarge (the minimise button, stood down), ButtonOptions, ButtonIdleWorker
                           and PopupCommunicator
  All in the page's pixels, a pixel of an 800x600 screen.  Without this page the plates draw.

  Edit the copy under Run/Window/Html and the next match reads it.
-->
<html>
<head>
<meta charset="utf-8">
<title>Command bar</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { background-color: #3b4a36; font-size: 8px; color: #dfe5ea; }
  .hidden { display: none; }
  .piece { position: absolute; }

  /* a panel: a dark body under a steel rail, lit along the top and left like the other pages */
  .panel { background-color: rgba(10, 16, 20, 0.94); border-top: 1px solid #aab4bf; border-left: 1px solid #8a949f;
           border-right: 1px solid #1a2026; }
  .rail { position: absolute; left: 0; right: 0; top: 0; height: 7px;
          background: linear-gradient(to bottom, #7d8691, #3f4650); border-bottom: 1px solid #0c1114; }
  .china .panel { background-color: rgba(24, 9, 7, 0.94); border-top-color: #d98a72; border-left-color: #b8604b; }
  .china .rail { background: linear-gradient(to bottom, #9a4331, #4c1b13); }
  .gla .panel { background-color: rgba(21, 18, 8, 0.94); border-top-color: #cbbf82; border-left-color: #a99d62; }
  .gla .rail { background: linear-gradient(to bottom, #8f8249, #48401e); }

  /* a panel is a container exactly as big as what it holds - the radar, the command grid, the
     portrait - and a border of steel outside it, out to the screen's edge on the sides against it.
     The game hands each one its corner, its container's size and the four border widths.  The
     container is dark behind what it holds; everything else stands outside the border */
  .frame { border-style: solid; border-color: #6f7782; border-top-color: #aab4bf; border-left-color: #8a949f;
           border-bottom-color: #3f4650; border-right-color: #4b535e; background-color: rgba(4, 8, 10, 0.94); }
  .china .frame { border-color: #8e3b2b; border-top-color: #d98a72; border-left-color: #b8604b; border-bottom-color: #4c1b13; border-right-color: #6a2a1e;
                  background-color: rgba(12, 4, 3, 0.94); }
  .gla .frame { border-color: #867a45; border-top-color: #cbbf82; border-left-color: #a99d62; border-bottom-color: #48401e; border-right-color: #625a31;
                background-color: rgba(10, 9, 4, 0.94); }

  /* a bezel, the console's plate and the top page's: steel lit from above over the whole border, a
     light line along its top and down a left side that faces the battlefield, a dark one down its
     right.  Every piece is placed from the container's corner with the border's widths written in,
     since the page cannot add a width to a width */
  /* every steel fill of the bar is 60 percent of the light it had until 2026-09-28, the owner's call
     for a darker bar: the plates, the grid wells and the tabs.  The light and dark bevel
     lines keep their colours, so the edges read as clearly on the darker steel */
  .bezel .steel { position: absolute; background: linear-gradient(to bottom, #5c6268, #363b41 30%, #20242a); }
  .bezel .shine { position: absolute; height: 1px; background-color: #dde4ea; }
  .bezel .lit { position: absolute; width: 1px; background-color: #b3bbc4; }
  .bezel .shade { position: absolute; width: 1px; background-color: #0c1114; }
  .china .bezel .lit { background-color: #d58a70; }
  .gla .bezel .lit { background-color: #cabe86; }
  .china .bezel .steel { background: linear-gradient(to bottom, #733f31, #491d13 30%, #260d09); }
  .china .bezel .shine { background-color: #f0b8a4; }
  .gla .bezel .steel { background: linear-gradient(to bottom, #6e6742, #473f23 30%, #24200f); }
  .gla .bezel .shine { background-color: #ebe2b4; }
  /* the command grid: its well is steel, and each of the fourteen places a dark hole exactly its
     picture's size, a ring of the well's steel {{ring}} wide round it, half the gap to the next, and
     a bevel on the hole's edge; an empty place shows as a hole.  The page is drawn a second time as
     the front, after each grid's buttons, with only the rings and the bevels, so the grid lies over
     the buttons and takes no more than the bevel's pixel off a picture */
  .front .piece { display: none; }
  .front .piece.over { display: block; }
  .commandcell { background-color: #020405; }
  .commandcell.over { background: none; }
  .commandcell .edge { position: absolute; border-style: solid; border-color: #23272c; }
  .china .commandcell .edge { border-color: #290f09; }
  .gla .commandcell .edge { border-color: #282311; }
  /* the bevel lies on the picture's outermost pixel, where a button draws its own border line */
  .commandcell .bevel { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border: 1px solid #06090b;
                        border-bottom-color: #9aa4ae; border-right-color: #9aa4ae; }
  .china .commandcell .bevel { border-bottom-color: #d98a72; border-right-color: #d98a72; }
  .gla .commandcell .bevel { border-bottom-color: #cbbf82; border-right-color: #cbbf82; }

  /* the console's sections: a header strip of the tabs' steel over each, and a well sunk two pixels
     in the plate under it, its edge outside the well's own size since the page adds a border to a
     width rather than taking it out */
  .header { background: linear-gradient(to bottom, #4a4f55, #33383e); border-top: 1px solid #8a949f; }
  .china .header { background: linear-gradient(to bottom, #5e3326, #3f1911); border-top-color: #b8604b; }
  .gla .header { background: linear-gradient(to bottom, #5a5434, #3d371d); border-top-color: #a99d62; }
  .hollow { position: absolute; left: -2px; top: -2px; border: 2px solid #06090b; border-bottom-color: #b4bec8; border-right-color: #b4bec8;
            background-color: #23272c; }
  .china .hollow { border-bottom-color: #d98a72; border-right-color: #d98a72; background-color: #290f09; }
  .gla .hollow { border-bottom-color: #cbbf82; border-right-color: #cbbf82; background-color: #282311; }

  /* a lone unit's name, its health's groove, which Readout.html lights and writes the figure under,
     its veterancy as gold stars at the right hand end of that figure's line, and then two rows of
     figures, a small grey label over each: its main weapon's, and what its armour does to the damage
     most of the fighting deals, green where it takes less and red where it takes more.  The column
     beside the portrait is 108 by 78 page pixels from just under the well's top, so the name takes
     two lines and every row is cut to the pixel to fit.  The game's 9 pixel bold font sets a name's
     letters 10 high and its 7 pixel font a label's 8, so a name's line is 11, a label's 8, and its
     figure starts a pixel under that */
  .selinfo .name { position: absolute; left: 0; top: 0; height: 22px; line-height: 11px; font-size: 9px; font-weight: bold;
                   color: #f1f4f6; }
  .selinfo .vet { position: absolute; top: 29px; width: 9px; height: 9px; background-size: 100% 100%;
                  background-repeat: no-repeat; background-image: url(Icons/RankStar.svg); }
  .selinfo .health { position: absolute; left: 0; top: 23px; height: 4px; background-color: #0d1512; border-bottom: 1px solid #3f4650; }
  .selinfo .figure { position: absolute; height: 18px; white-space: nowrap; }
  .selinfo .weapon { top: 40px; }
  .selinfo .armor { top: 60px; }
  .selinfo .figure .label { position: absolute; left: 0; top: 0; height: 8px; line-height: 8px; font-size: 7px; color: #8a949f; }
  .selinfo .figure .value { position: absolute; left: 0; top: 9px; height: 9px; line-height: 9px; font-size: 8px; font-weight: bold; color: #f1f4f6; }
  .selinfo .figure.strong .value { color: #7fd36a; }
  .selinfo .figure.weak .value { color: #ef6a4c; }

  /* the general's powers' steel, a column at a time: the console's steel with its light top line,
     and a dark line down the part of its right hand side that faces the battlefield */
  .powersteel .steel { left: 0; top: 0; right: 0; bottom: 0; }
  .powersteel .shine { left: 0; right: 0; top: 0; }
  .powersteel .shade { right: 0; top: 0; }

  /* the money's well on the top page.  The money's figure is the bar's own window over its well */
  .stack { box-sizing: border-box; margin: 0; }
  .moneywell { background-color: #020405; }
  .moneywell .lip { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border: 1px solid #06090b;
                    border-bottom-color: #b4bec8; border-right-color: #b4bec8; }
  .china .moneywell .lip { border-bottom-color: #d98a72; border-right-color: #d98a72; }
  .gla .moneywell .lip { border-bottom-color: #cbbf82; border-right-color: #cbbf82; }

  /* a groove: the power bar sunk in its block the way the radar and the grid are, two pixels dark
     along the top and left and lit along the bottom and right, round a black lip */
  .groove { margin: -3px 0 0 -3px; border: 2px solid #06090b; border-bottom-color: #b4bec8; border-right-color: #b4bec8;
            background-color: #020405; }
  .groove .lip { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border: 1px solid #000000; }
  /* the power bar's frame in the stack arrives placed exactly, and the groove's own pull up and left
     left a gap under it */
  .groove.stack { margin: 0; }

  /* the power bar is the page's: a row of cells along the groove, lit from the left up to the
     production in the power bar's own green, yellow or red, a black line between every two, and the
     consumption a white needle across them.  Full is every cell, lip to lip */
  /* the row's height is the frame's inside, {{powerframe.inner}}, written in: a percentage of a
     height set by top and bottom does not resolve here, and the cells came out with none */
  .cells { position: absolute; left: 1px; top: 1px; right: 1px; }
  /* each cell stands at its own {{x}} and {{w}} in pixels, and the gap is the inner block's margin:
     a percentage of an absolutely placed box does not resolve here at all */
  .cells .cell { position: absolute; top: 0; }
  .cells .seg { margin-left: 1px; background-color: #0d1512; background-size: 100% 100%; background-repeat: no-repeat; }
  .cells .lit .seg { background-image: url(PowerBarGreen); }
  .cells.yellow .lit .seg { background-image: url(PowerBarYellow); }
  .cells.red .lit .seg { background-image: url(PowerBarRed); }
  /* the needle is a gauge pointer through the whole groove at {{power.needlex}} pixels in: a white
     stem outlined in black so it reads on a lit cell as well as a dark one, capped top and bottom
     where it crosses the groove's edges.  It stands after the lip so the lip does not cut it */
  .needle { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -1px; background-color: #000000; }
  .needle .stem { position: absolute; left: 1px; right: 1px; top: 1px; bottom: 1px; background-color: #f4f6f8; }
  .needle .cap { position: absolute; left: -1px; width: 4px; height: 1px; border: 1px solid #000000; background-color: #f4f6f8; }
  .needle .head { top: -1px; }
  .needle .foot { bottom: -1px; }
  .china .groove { border-bottom-color: #d98a72; border-right-color: #d98a72; }
  .gla .groove { border-bottom-color: #cbbf82; border-right-color: #cbbf82; }

  /* the bar's own buttons: a steel cap, lit gold under the pointer and pressed in when pushed */
  .button { text-align: center; color: #e8eef2; font-weight: bold;
            background: linear-gradient(to bottom, #7d8691, #3f4650); border: 1px solid #0c1114;
            border-top-color: #c3ccd3; border-left-color: #aab4bf; }
  .china .button { background: linear-gradient(to bottom, #a44734, #4c1b13); border-top-color: #e8a28a; border-left-color: #d98a72; }
  .gla .button { background: linear-gradient(to bottom, #978a50, #48401e); border-top-color: #ddd29a; border-left-color: #cbbf82; }
  .button.hilite, .button:hover { color: #ffffff; border-color: #e8d27a; }
  .button.pushed { background: linear-gradient(to bottom, #2a3036, #4b535e); border-top-color: #0c1114; border-left-color: #0c1114; }
  .button.disabled { color: #6f7782; }
  .button .cap { position: absolute; left: 0; right: 0; top: 50%; margin-top: -5px; line-height: 10px; }

  /* the menu: three bars in a square cap in the screen's top left corner */
  .menu { left: 4px; top: 4px; width: 18px; height: 16px; }
  .menu .bar { position: absolute; left: 4px; right: 4px; height: 2px; background-color: #e8eef2; }
  .menu:hover .bar { background-color: #e8d27a; }

  /* a tab cut from a bezel's own steel, standing on its top edge and running down into it */
  .tab { background: linear-gradient(to bottom, #6b7076, #53595f); border-top: 1px solid #dde4ea; border-right: 1px solid #0c1114; }
  .china .tab { background: linear-gradient(to bottom, #805343, #733f31); border-top-color: #f0b8a4; }
  .gla .tab { background: linear-gradient(to bottom, #797250, #6e6742); border-top-color: #ebe2b4; }

  /* a key sunk in the steel with a one-colour SVG on it, the smoke signals' and the idle worker's:
     under the pointer it comes up out of its well as lit steel with a gold rim, and a key whose
     button has nothing to do is veiled */
  .key { position: absolute; top: 1px; width: 26px; height: 18px; background-color: rgba(4, 8, 10, 0.9);
         border: 1px solid #06090b; border-bottom-color: #9aa4ae; border-right-color: #9aa4ae; }
  .key:hover { background: linear-gradient(to bottom, #b3bbc4, #5a626c); border-color: #e8d27a; }
  .china .key:hover { background: linear-gradient(to bottom, #d58a70, #7a3120); }
  .gla .key:hover { background: linear-gradient(to bottom, #cabe86, #766a3a); }
  .key .icon { position: absolute; left: 6px; top: 2px; width: 14px; height: 14px;
               background-size: 100% 100%; background-repeat: no-repeat; }
  /* pressed, the key under the pointer while the left button is {{held}}: sunk deeper than at rest,
     dark on top and lit below, the gold rim kept and the picture a pixel down */
  .held .key:hover { background: linear-gradient(to bottom, #151a1f, #3a414a); border-color: #e8d27a; }
  .china .held .key:hover { background: linear-gradient(to bottom, #1c0906, #5a2217); }
  .gla .held .key:hover { background: linear-gradient(to bottom, #19160a, #4f4623); }
  .held .key:hover .icon { top: 3px; }
  .key .veil { display: none; }
  .disabled .key .veil { display: block; position: absolute; left: 0; top: 0; width: 26px; height: 18px;
                         background-color: rgba(4, 8, 10, 0.65); }

  /* the header's tabs stand on a grid of 30 pixel slots, a key 28 wide with its rim a pixel in from
     each slot's left.  The idle worker: a key in a tab of a slot at the selection's header's left end */
  .idle .key { left: 1px; }
  .idle .icon { background-image: url(Icons/IdleWorker.svg); }
  .watching .idle { display: none; }
  /* while a worker stands idle the key flashes, {{idleflash}} "flash" for half of every 0.7 seconds:
     amber and white-rimmed, the brightest thing on the bar, then back to the sunk key */
  .idle.flash .key { background: linear-gradient(to bottom, #ffc640, #d06a00); border-color: #ffffff; }

  /* the command panel's attack, hold position and move: keys over their places' holes wearing
     cameos painted for them (Code/Tools/order_cameos.py, the mapped images ReforgedOrderAttack,
     ReforgedOrderHold and ReforgedOrderMove), with the game's own lit and pushed overlays over them
     the way its command buttons wear them */
  .order { background-size: 100% 100%; background-repeat: no-repeat; }
  .order.attack { background-image: url(ReforgedOrderAttack); }
  .order.hold { background-image: url(ReforgedOrderHold); }
  .order.move { background-image: url(ReforgedOrderMove); }
  .order.aggressive { background-image: url(ReforgedOrderAggressive); }
  .order.defensive { background-image: url(ReforgedOrderDefensive); }
  .order .glow { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-size: 100% 100%; background-repeat: no-repeat; }
  .order:hover .glow { background-image: url(Cameo_hilited); }
  .held .order:hover .glow { background-image: url(Cameo_push); }
  /* the key in each one's top left corner is the game's, lettered the way the command buttons'
     are (InGameUI::drawCellGridFront) */

  /* the skills key: the rank, and the promotion button, a key like the idle worker's in a tab of two
     slots after the idle worker's, a star on it for every rank there
     is, gold up to the one reached and dark past it.  The key is 58 by 17 with its rim, a pixel in
     from the tab's left and two down.  Under the pointer it comes
     up as lit steel with a gold rim, and while a promotion waits to be spent it blinks in the side's own
     steel at its brightest, a white rim round it.  The stars carry a dark outline so the gold reads
     on the lit key as well, and an unreached one is a dark star rimmed in light steel */
  .rank .key { left: 1px; top: 2px; width: 56px; height: 15px; }
  .rank.hilite .key { background: linear-gradient(to bottom, #b3bbc4, #5a626c); border-color: #e8d27a; }
  .china .rank.hilite .key { background: linear-gradient(to bottom, #d58a70, #7a3120); }
  .gla .rank.hilite .key { background: linear-gradient(to bottom, #cabe86, #766a3a); }
  .rank.ready.lit .key { background: linear-gradient(to bottom, #eef3f7, #6f7883); border-color: #ffffff; }
  .china .rank.ready.lit .key { background: linear-gradient(to bottom, #ffc4ae, #a4432e); border-color: #ffe4d8; }
  .gla .rank.ready.lit .key { background: linear-gradient(to bottom, #f4ecc0, #8f8249); border-color: #fff8dc; }
  /* pressed through its own window, which the bar marks pushed, or held under the pointer */
  .rank.pushed .key, .held .rank .key:hover { background: linear-gradient(to bottom, #151a1f, #3a414a); border-color: #e8d27a; }
  .china .rank.pushed .key, .china .held .rank .key:hover { background: linear-gradient(to bottom, #1c0906, #5a2217); }
  .gla .rank.pushed .key, .gla .held .rank .key:hover { background: linear-gradient(to bottom, #19160a, #4f4623); }
  .rank.pushed .star, .held .rank .key:hover .star { margin-top: 1px; }
  .rank .star { position: absolute; top: 2px; width: 10px; height: 10px; background-size: 100% 100%;
                background-repeat: no-repeat; background-image: url(Icons/RankStarDark.svg); }
  .rank .star.lit { background-image: url(Icons/RankStar.svg); }
  .rank.disabled .key .veil { display: block; position: absolute; left: 0; top: 0; width: 56px; height: 15px;
                              background-color: rgba(4, 8, 10, 0.65); }

  /* the experience bar: rungs up the groove beside the radar, lit gold from the bottom up to the way
     from this rank to the next, a black line over each */
  .rungs { position: absolute; left: 1px; top: 1px; bottom: 1px; }
  .rungs .rung { position: absolute; left: 0; }
  .rungs .seg { margin-top: 1px; background-color: #15130c; }
  .rungs .lit .seg { background: linear-gradient(to right, #8a6a14, #f6d860, #b08a24); }

  /* the top page's bottom edge is shaded, since it hangs over the battlefield rather than standing
     on the screen's edge */
  .bezel .base { position: absolute; height: 1px; background-color: #0c1114; }

  /* the smoke signals: three slots after the skills key, a key in each: a crosshair to
     attack, a shield to defend, an eye to look */
  /* each key stands at its own left, pushed down by {{signalN.drop}} while it rises: a relatively
     placed box inside an absolutely placed one is laid out from the screen's corner here, and the
     row came out in the top left */
  .signal.attack .icon { background-image: url(Icons/SignalAttack.svg); }
  .signal.defend .icon { background-image: url(Icons/SignalDefend.svg); }
  .signal.look .icon { background-image: url(Icons/SignalLook.svg); }
</style>
</head>
<body>
<div class="{{layer}} {{side}} {{watching}} {{held}}">

  <!-- the console: one plate of steel, and a header strip and a well for each of its sections -->
  <div class="piece frame bezel solid {{console.shown}}" style="left: {{console.x}}px; top: {{console.y}}px; width: {{console.w}}px; height: {{console.h}}px; border-width: {{console.bt}}px {{console.br}}px {{console.bb}}px {{console.bl}}px">
    <div class="steel" style="left: -{{console.bl}}px; right: -{{console.br}}px; top: -{{console.bt}}px; bottom: -{{console.bb}}px"></div>
    <div class="shine" style="left: -{{console.bl}}px; right: -{{console.br}}px; top: -{{console.bt}}px"></div>
    <div class="lit" style="left: -{{console.bl}}px; top: -{{console.bt}}px; bottom: -{{console.bb}}px"></div>
    <div class="shade" style="right: -{{console.br}}px; top: -{{console.bt}}px; bottom: -{{console.bb}}px"></div>
  </div>
  <div data-each="wells">
    <div class="piece header {{header.shown}}" style="left: {{header.x}}px; top: {{header.y}}px; width: {{header.w}}px; height: {{header.h}}px"></div>
    <div class="piece" style="left: {{well.x}}px; top: {{well.y}}px; width: {{well.w}}px; height: {{well.h}}px"><div class="hollow" style="width: {{well.w}}px; height: {{well.h}}px"></div></div>
  </div>
  <div class="piece groove solid stack {{expframe.shown}}" style="left: {{expframe.x}}px; top: {{expframe.y}}px; width: {{expframe.w}}px; height: {{expframe.h}}px">
    <div class="rungs" style="width: {{expframe.innerw}}px"><div class="rung {{lit}}" data-each="expcells" style="top: {{y}}px; height: {{h}}px; width: {{expframe.innerw}}px"><div class="seg" style="width: {{expframe.innerw}}px; height: {{segh}}px"></div></div></div>
    <div class="lip"></div>
  </div>
  <div class="piece tab rank {{skillstab.shown}} {{promotion}} {{blink}} {{ButtonGeneral.state}}" style="left: {{skillstab.x}}px; top: {{skillstab.y}}px; width: {{skillstab.w}}px; height: {{skillstab.h}}px">
    <div class="key" data-click="press:ButtonGeneral"><div class="star {{lit}}" data-each="rankstars" style="left: {{x}}px"></div><div class="veil"></div></div>
  </div>
  <div class="piece tab signals solid {{signals.shown}}" style="left: {{signals.x}}px; top: {{signals.y}}px; width: {{signals.w}}px; height: {{signals.h}}px">
    <div class="key signal attack" data-click="signal:attack" style="left: 1px; margin-top: {{signal0.drop}}px"><div class="icon"></div></div>
    <div class="key signal defend" data-click="signal:defend" style="left: 31px; margin-top: {{signal1.drop}}px"><div class="icon"></div></div>
    <div class="key signal look" data-click="signal:look" style="left: 61px; margin-top: {{signal2.drop}}px"><div class="icon"></div></div>
  </div>

  <!-- the general's powers' steel, stepping down from the console's right hand end -->
  <div class="piece bezel solid powersteel" data-each="powersteel" style="left: {{plate.x}}px; top: {{plate.y}}px; width: {{plate.w}}px; height: {{plate.h}}px">
    <div class="steel"></div>
    <div class="shine"></div>
    <div class="shade" style="height: {{shadeh}}px"></div>
  </div>

  <!-- the top page: the match clock in a plate from the top edge, and the money in its own plate
       hung under it -->
  <div class="piece frame bezel solid {{clockbar.shown}}" style="left: {{clockbar.x}}px; top: {{clockbar.y}}px; width: {{clockbar.w}}px; height: {{clockbar.h}}px; border-width: {{clockbar.bt}}px {{clockbar.br}}px {{clockbar.bb}}px {{clockbar.bl}}px">
    <div class="steel" style="left: -{{clockbar.bl}}px; right: -{{clockbar.br}}px; top: -{{clockbar.bt}}px; bottom: -{{clockbar.bb}}px"></div>
    <div class="lit" style="left: -{{clockbar.bl}}px; top: -{{clockbar.bt}}px; bottom: -{{clockbar.bb}}px"></div>
    <div class="shade" style="right: -{{clockbar.br}}px; top: -{{clockbar.bt}}px; bottom: -{{clockbar.bb}}px"></div>
    <div class="base" style="left: -{{clockbar.bl}}px; right: -{{clockbar.br}}px; bottom: -{{clockbar.bb}}px"></div>
  </div>
  <div class="piece frame bezel solid {{moneybar.shown}}" style="left: {{moneybar.x}}px; top: {{moneybar.y}}px; width: {{moneybar.w}}px; height: {{moneybar.h}}px; border-width: {{moneybar.bt}}px {{moneybar.br}}px {{moneybar.bb}}px {{moneybar.bl}}px">
    <div class="steel" style="left: -{{moneybar.bl}}px; right: -{{moneybar.br}}px; top: -{{moneybar.bt}}px; bottom: -{{moneybar.bb}}px"></div>
    <div class="shine" style="left: -{{moneybar.bl}}px; right: -{{moneybar.br}}px; top: -{{moneybar.bt}}px"></div>
    <div class="lit" style="left: -{{moneybar.bl}}px; top: -{{moneybar.bt}}px; bottom: -{{moneybar.bb}}px"></div>
    <div class="shade" style="right: -{{moneybar.br}}px; top: -{{moneybar.bt}}px; bottom: -{{moneybar.bb}}px"></div>
    <div class="base" style="left: -{{moneybar.bl}}px; right: -{{moneybar.br}}px; bottom: -{{moneybar.bb}}px"></div>
  </div>
  <div class="piece frame bezel solid {{peacebar.shown}}" style="left: {{peacebar.x}}px; top: {{peacebar.y}}px; width: {{peacebar.w}}px; height: {{peacebar.h}}px; border-width: {{peacebar.bt}}px {{peacebar.br}}px {{peacebar.bb}}px {{peacebar.bl}}px">
    <div class="steel" style="left: -{{peacebar.bl}}px; right: -{{peacebar.br}}px; top: -{{peacebar.bt}}px; bottom: -{{peacebar.bb}}px"></div>
    <div class="shine" style="left: -{{peacebar.bl}}px; right: -{{peacebar.br}}px; top: -{{peacebar.bt}}px"></div>
    <div class="lit" style="left: -{{peacebar.bl}}px; top: -{{peacebar.bt}}px; bottom: -{{peacebar.bb}}px"></div>
    <div class="shade" style="right: -{{peacebar.br}}px; top: -{{peacebar.bt}}px; bottom: -{{peacebar.bb}}px"></div>
    <div class="base" style="left: -{{peacebar.bl}}px; right: -{{peacebar.br}}px; bottom: -{{peacebar.bb}}px"></div>
  </div>
  <div class="piece moneywell {{peace.shown}}" style="left: {{peace.x}}px; top: {{peace.y}}px; width: {{peace.w}}px; height: {{peace.h}}px"><div class="lip"></div></div>
  <div class="piece moneywell {{clock.shown}}" style="left: {{clock.x}}px; top: {{clock.y}}px; width: {{clock.w}}px; height: {{clock.h}}px"><div class="lip"></div></div>
  <div class="piece groove stack {{powerframe.shown}}" style="left: {{powerframe.x}}px; top: {{powerframe.y}}px; width: {{powerframe.w}}px; height: {{powerframe.h}}px">
    <div class="cells {{power.state}}" style="height: {{powerframe.inner}}px"><div class="cell {{lit}}" data-each="powercells" style="left: {{x}}px; width: {{w}}px; height: {{powerframe.inner}}px"><div class="seg" style="height: {{powerframe.inner}}px; width: {{segw}}px"></div></div></div>
    <div class="lip"></div>
    <div class="needle {{power.consumes}}" style="left: {{power.needlex}}px"><div class="stem"></div><div class="cap head"></div><div class="cap foot"></div></div>
  </div>
  <div class="piece tab idle {{idletab.shown}} {{ButtonIdleWorker.state}} {{idleflash}}" style="left: {{idletab.x}}px; top: {{idletab.y}}px; width: {{idletab.w}}px; height: {{idletab.h}}px">
    <div class="key" data-click="press:ButtonIdleWorker"><div class="icon"></div><div class="veil"></div></div>
  </div>
  <!-- the money, under the clock; the figure is the bar's own window over its well -->
  <div class="piece moneywell {{moneyblock.shown}}" style="left: {{moneyblock.x}}px; top: {{moneyblock.y}}px; width: {{moneyblock.w}}px; height: {{moneyblock.h}}px"><div class="lip"></div></div>
  <!-- a lone unit's name, health, veterancy, weapon and armour beside its portrait in the selection's well -->
  <div class="piece selinfo {{selinfo.shown}}" style="left: {{selinfo.x}}px; top: {{selinfo.y}}px; width: {{selinfo.w}}px; height: {{selinfo.h}}px">
    <div class="name" style="width: {{selinfo.w}}px">{{sel.name}}</div>
    <div class="vet" data-each="selstars" style="right: {{x}}px"></div>
    <div class="health {{sel.healthshown}}" style="width: {{selinfo.w}}px"></div>
    <div class="figure weapon {{state}}" data-each="selweapon" style="left: {{x}}px"><div class="label">{{label}}</div><div class="value">{{value}}</div></div>
    <div class="figure armor {{state}}" data-each="selarmor" style="left: {{x}}px"><div class="label">{{label}}</div><div class="value">{{value}}</div></div>
  </div>
  <div class="piece commandcell" data-each="commandcells" style="left: {{cell.x}}px; top: {{cell.y}}px; width: {{cell.w}}px; height: {{cell.h}}px"><div class="edge" style="left: -{{ring}}px; top: -{{ring}}px; right: -{{ring}}px; bottom: -{{ring}}px; border-width: {{ring}}px"></div><div class="bevel"></div></div>
  <div class="piece commandcell" data-each="portraitcells" style="left: {{cell.x}}px; top: {{cell.y}}px; width: {{cell.w}}px; height: {{cell.h}}px"><div class="edge" style="left: -{{ring}}px; top: -{{ring}}px; right: -{{ring}}px; bottom: -{{ring}}px; border-width: {{ring}}px"></div><div class="bevel"></div></div>
  <div class="piece order attack {{attackkey.shown}}" data-click="order:attack" style="left: {{attackkey.x}}px; top: {{attackkey.y}}px; width: {{attackkey.w}}px; height: {{attackkey.h}}px"><div class="glow"></div></div>
  <div class="piece order hold {{holdkey.shown}}" data-click="order:hold" style="left: {{holdkey.x}}px; top: {{holdkey.y}}px; width: {{holdkey.w}}px; height: {{holdkey.h}}px"><div class="glow"></div></div>
  <div class="piece order move {{movekey.shown}}" data-click="order:move" style="left: {{movekey.x}}px; top: {{movekey.y}}px; width: {{movekey.w}}px; height: {{movekey.h}}px"><div class="glow"></div></div>
  <div class="piece order {{stance}} {{stancekey.shown}}" data-click="order:stance" style="left: {{stancekey.x}}px; top: {{stancekey.y}}px; width: {{stancekey.w}}px; height: {{stancekey.h}}px"><div class="glow"></div></div>

  <div class="piece commandcell" data-each="skillcells" style="left: {{cell.x}}px; top: {{cell.y}}px; width: {{cell.w}}px; height: {{cell.h}}px"><div class="edge" style="left: -{{ring}}px; top: -{{ring}}px; right: -{{ring}}px; bottom: -{{ring}}px; border-width: {{ring}}px"></div><div class="bevel"></div></div>

  <!-- the front: one grid's frames again, drawn after its buttons -->
  <div class="piece commandcell over" data-each="frontcells" style="left: {{cell.x}}px; top: {{cell.y}}px; width: {{cell.w}}px; height: {{cell.h}}px"><div class="edge" style="left: -{{ring}}px; top: -{{ring}}px; right: -{{ring}}px; bottom: -{{ring}}px; border-width: {{ring}}px"></div><div class="bevel"></div></div>

  <div class="piece button menu {{ButtonOptions.state}}" data-click="press:ButtonOptions">
    <div class="bar" style="top: 4px"></div>
    <div class="bar" style="top: 7px"></div>
    <div class="bar" style="top: 10px"></div>
  </div>

</div>
</body>
</html>
