name: PT-BR x64 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      config:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options: [Release, RelWithDebInfo, Debug]
      run_tests:
        description: Run ctest after build
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install public build dependencies
        shell: pwsh
        run: |
          python PTBR\tools\install_public_dependencies.py --repo .

      - name: Audit complete build prerequisites
        shell: pwsh
        run: |
          python PTBR\tools\audit_build_prereqs.py --repo .

      - name: Detect optional PT-BR media
        id: media
        shell: pwsh
        env:
          MEDIA_URL: ${{ secrets.PTBR_MEDIA_URL }}
          MEDIA_SHA256: ${{ secrets.PTBR_MEDIA_SHA256 }}
        run: |
          $hasUrl = -not [string]::IsNullOrWhiteSpace($env:MEDIA_URL)
          $hasHash = -not [string]::IsNullOrWhiteSpace($env:MEDIA_SHA256)
          if (-not $hasUrl -and -not $hasHash) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "::notice::PT-BR media not configured; build continues with text and runtime media fallback."
          } elseif ($hasUrl -xor $hasHash) {
            throw "Configure both PTBR_MEDIA_URL and PTBR_MEDIA_SHA256, or leave both empty."
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Download optional PT-BR media
        if: steps.media.outputs.enabled == 'true'
        shell: pwsh
        env:
          MEDIA_URL: ${{ secrets.PTBR_MEDIA_URL }}
          MEDIA_TOKEN: ${{ secrets.PTBR_MEDIA_TOKEN }}
        run: |
          $headers = @{}
          if (-not [string]::IsNullOrWhiteSpace($env:MEDIA_TOKEN)) {
            $headers["Authorization"] = "Bearer $env:MEDIA_TOKEN"
          }
          Invoke-WebRequest -Uri $env:MEDIA_URL -Headers $headers -OutFile "$env:RUNNER_TEMP\ptbr-media.zip"

      - name: Install and verify optional PT-BR media
        if: steps.media.outputs.enabled == 'true'
        shell: pwsh
        env:
          MEDIA_SHA256: ${{ secrets.PTBR_MEDIA_SHA256 }}
        run: |
          python PTBR\tools\install_ptbr_media_bundle.py `
            --package PTBR `
            --archive "$env:RUNNER_TEMP\ptbr-media.zip" `
            --sha256 "$env:MEDIA_SHA256"

      - name: Apply PT-BR, validate and build x64
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CONFIG: ${{ inputs.config }}
          INPUT_RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $buildConfig = $env:INPUT_CONFIG
            $runTests = $env:INPUT_RUN_TESTS
          } else {
            $buildConfig = "Release"
            $runTests = "true"
          }

          if ([string]::IsNullOrWhiteSpace($buildConfig)) {
            $buildConfig = "Release"
          }

          $runnerArgs = @(".", "--config", "$buildConfig", "--clean", "--allow-dirty")
          if ($runTests -ne "true") { $runnerArgs += "--skip-tests" }
          python PTBR\tools\run_windows_stage15.py @runnerArgs

      - name: Assemble downloadable PT-BR build
        shell: pwsh
        run: |
          # Everything the x64 build lays out in GeneralsMD\Run for the game: the exe with its PDB
          # (the crash log names functions through it), the five FFmpeg DLLs sound and video
          # decode with, and the loose data CMake copies there. Data\INI and Data\Scripts are in
          # the multiplayer checksum, so they ship with the exe they were built with. Scenarios\
          # and Cinema\ are measuring tools, left out.
          $run = "GeneralsMD\Run"
          $out = "PTBR_BUILD_ARTIFACT"
          New-Item -ItemType Directory -Force $out | Out-Null
          $files = @(
            "generals.exe", "generals.pdb", "Install_Final.bmp",
            "avcodec-62.dll", "avformat-62.dll", "avutil-60.dll", "swresample-6.dll", "swscale-9.dll"
          )
          foreach ($f in $files) {
            if (-not (Test-Path "$run\$f")) { throw "missing from Run: $f" }
            Copy-Item "$run\$f" "$out\$f" -Force
          }
          foreach ($d in @("Data", "Art", "Window")) {
            if (-not (Test-Path "$run\$d")) { throw "missing from Run: $d\" }
            Copy-Item "$run\$d" "$out\$d" -Recurse -Force
          }
          if (-not (Test-Path "$out\Data\PortugueseBrazil\Generals.str")) {
            throw "PT-BR text missing from the artifact"
          }
          Copy-Item "PTBR_STAGE15_RESULTS\result.json" "$out\STAGE15_BUILD_RESULT.json" -Force
          @"
          Zero Hour Reforged PT-BR build (x64).
          Requires a legally owned Zero Hour installation: copy these files over a Reforged
          install, or put Zero Hour's *.big next to generals.exe and the base game's *.big
          in ZH_Generals\. No game data ships here. Sound and video run through the FFmpeg
          DLLs included; mss32.dll and binkw32.dll are not used by the 64-bit build.
          "@ | Set-Content "$out\README_INSTALL.txt" -Encoding UTF8

      - name: Upload PT-BR build
        uses: actions/upload-artifact@v6
        with:
          name: ZH-Reforged-PTBR-${{ github.event_name == 'workflow_dispatch' && inputs.config || 'Release' }}-${{ github.run_number }}
          path: PTBR_BUILD_ARTIFACT/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ZH-Reforged-PTBR-logs-${{ github.run_number }}
          path: |
            PTBR_STAGE15_RESULTS/
            build/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14
