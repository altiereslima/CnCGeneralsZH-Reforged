name: PT-BR Win32 Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      config:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options: [Release, RelWithDebInfo, Debug]
      run_tests:
        description: Run ctest after build
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: python PTBR\scripts\dependencies.py --repo .

      - name: Validate build prerequisites
        shell: pwsh
        run: python PTBR\scripts\validate.py --repo . --prereqs-only

      - name: Detect optional localized media
        id: media
        shell: pwsh
        env:
          MEDIA_URL: ${{ secrets.PTBR_MEDIA_URL }}
          MEDIA_SHA256: ${{ secrets.PTBR_MEDIA_SHA256 }}
        run: |
          $hasUrl = -not [string]::IsNullOrWhiteSpace($env:MEDIA_URL)
          $hasHash = -not [string]::IsNullOrWhiteSpace($env:MEDIA_SHA256)
          if (-not $hasUrl -and -not $hasHash) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } elseif ($hasUrl -xor $hasHash) {
            throw "Configure both PTBR_MEDIA_URL and PTBR_MEDIA_SHA256, or leave both empty."
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Download localized media
        if: steps.media.outputs.enabled == 'true'
        shell: pwsh
        env:
          MEDIA_URL: ${{ secrets.PTBR_MEDIA_URL }}
          MEDIA_TOKEN: ${{ secrets.PTBR_MEDIA_TOKEN }}
        run: |
          $headers = @{}
          if (-not [string]::IsNullOrWhiteSpace($env:MEDIA_TOKEN)) {
            $headers["Authorization"] = "Bearer $env:MEDIA_TOKEN"
          }
          Invoke-WebRequest -Uri $env:MEDIA_URL -Headers $headers -OutFile "$env:RUNNER_TEMP\ptbr-media.zip"

      - name: Install localized media
        if: steps.media.outputs.enabled == 'true'
        shell: pwsh
        env:
          MEDIA_SHA256: ${{ secrets.PTBR_MEDIA_SHA256 }}
        run: |
          python PTBR\scripts\media.py `
            --package PTBR `
            --archive "$env:RUNNER_TEMP\ptbr-media.zip" `
            --sha256 "$env:MEDIA_SHA256"

      - name: Build
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CONFIG: ${{ inputs.config }}
          INPUT_RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $config = $env:INPUT_CONFIG
            $tests = $env:INPUT_RUN_TESTS
          } else {
            $config = "Release"
            $tests = "true"
          }
          if ([string]::IsNullOrWhiteSpace($config)) { $config = "Release" }

          $args = @(".", "--config", "$config", "--clean", "--allow-dirty")
          if ($tests -ne "true") { $args += "--skip-tests" }
          python PTBR\scripts\build.py @args

      - name: Package build
        shell: pwsh
        run: |
          $out = "PTBR_BUILD_ARTIFACT"
          New-Item -ItemType Directory -Force "$out\Data\PortugueseBrazil" | Out-Null
          Copy-Item "GeneralsMD\Run\generals.exe" "$out\generals.exe" -Force
          if (Test-Path "GeneralsMD\Run\generals.pdb") {
            Copy-Item "GeneralsMD\Run\generals.pdb" "$out\generals.pdb" -Force
          }
          Copy-Item "GeneralsMD\Run\Data\Patch.str" "$out\Data\Patch.str" -Force
          Copy-Item "GeneralsMD\Run\Data\PortugueseBrazil\*" "$out\Data\PortugueseBrazil\" -Recurse -Force
          Copy-Item "PTBR_BUILD_RESULTS\result.json" "$out\BUILD_RESULT.json" -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ZH-Reforged-PTBR-${{ github.run_number }}
          path: PTBR_BUILD_ARTIFACT/
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZH-Reforged-PTBR-logs-${{ github.run_number }}
          path: PTBR_BUILD_RESULTS/
          if-no-files-found: warn
          retention-days: 14
